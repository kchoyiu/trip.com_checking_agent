# Explicit one-way legs support an open-jaw itinerary.
legs:
  - origin: HKG
    destination: KHH
    depart_date: "2026-10-04"
  - origin: TPE
    destination: HKG
    depart_date: "2026-10-11"
adults: 1
currency: HKD
airline: "Cathay Pacific"
max_price: 2500
nonstop_only: false
alerts:
  price_threshold: 1800
  drop_percentage: 15
  deal_score: 75
  cooldown_hours: 24
  dedup_hours: 72
queue:
  max_jobs_per_run: 8
  min_interval_seconds: 8
  priority: [price_threshold, stale, never_checked, popularity]
scraper:
  headless: true
  timeout_ms: 30000
  retries: 2
  locale: en-HK
  base_url: "https://www.trip.com/flights/"
