services:
  trip-com-checking-agent:
    build: .
    container_name: trip-com-checking-agent
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      HOTEL_ALERT_DROP_PERCENTAGE: "${HOTEL_ALERT_DROP_PERCENTAGE:-10}"
      HOTEL_ALERT_COOLDOWN_HOURS: "${HOTEL_ALERT_COOLDOWN_HOURS:-24}"
      CHECK_INTERVAL_HOURS: "${CHECK_INTERVAL_HOURS:-1}"
      RUN_ONCE: "${RUN_ONCE:-0}"
      TRIP_CDP_URL: "${TRIP_CDP_URL:-}"
      TRIP_REUSE_CURRENT_PAGE: "${TRIP_REUSE_CURRENT_PAGE:-true}"
      TRIP_MANUAL_VERIFY_TIMEOUT_SECONDS: "${TRIP_MANUAL_VERIFY_TIMEOUT_SECONDS:-180}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    command: ["python", "main.py"]
